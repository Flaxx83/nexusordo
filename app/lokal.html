<!doctype html>
<!-- Utvecklingsläge: npx serve app → http://localhost:3000/lokal (laddar index.html, style.css och script.js var för sig). -->
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>NexusOrdo (lokalt)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    fetch('index.html').then(r => r.text()).then(html => {
      document.body.insertAdjacentHTML('afterbegin', html);
      // innerHTML kör inte inlagda <script>, så de läggs till på nytt (SheetJS först, sedan appen)
      const scripts = [...document.body.querySelectorAll('script[src]')].map(s => s.src);
      const next = () => {
        const src = scripts.shift() || 'script.js';
        const s = document.createElement('script');
        s.src = src;
        if (src !== 'script.js') s.onload = next;
        document.body.appendChild(s);
      };
      next();
    });
  </script>
</body>
</html>
